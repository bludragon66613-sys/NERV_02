name: React Doctor

on:
  pull_request:
    paths:
      - "dashboard/**"
      - ".github/workflows/react-doctor.yml"
  push:
    branches: [main]
    paths:
      - "dashboard/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: millionco/react-doctor@main
        with:
          directory: dashboard
          diff: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on: warning
